name: PR Check

on:
  pull_request:
    branches: [main]

# 연속 푸시의 중복 실행을 취소한다(e2e가 무겁다).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint (oxlint)
        run: bun run lint
      - name: Check formatting (oxfmt)
        run: bun run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test

  # 다른 잡은 setup-bun 기본값(최신 Bun)으로 돈다. Bun 1.3.x `$`의 never-settle 회귀는
  # 최신 Bun에서 보이지 않으므로 그 회귀망만 1.3.x 마지막 판으로 고정해 돈다. 지원 하한이
  # 1.4 이상이 되면 이 잡과 룰셋 항목을 함께 지운다(ci-release.md).
  test-bun13:
    runs-on: ubuntu-latest
    # 러너나 Bun 다운로드가 매달려도 기본 상한까지 태우지 않게.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      # `bun install`은 일부러 없다 — 이 회귀망은 내장 모듈과 로컬 파일만 쓴다. 설치를 넣으면
      # 최신 Bun이 lockfile 포맷을 바꾸는 날 1.3.14가 못 읽어 회귀와 무관하게 빨개진다
      # (그때 고정 판을 올리는 것은 이 잡의 존재 이유를 지우는 오답이다).
      - name: Bun 1.3.x `$` never-settle regression
        run: >-
          bun test
          apps/viewer/__tests__/diff-large-blob.test.ts
          apps/viewer/__tests__/git-output.test.ts
          apps/viewer/__tests__/git-large-output.test.ts
          apps/viewer/__tests__/git-cat-file-batch.test.ts

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: 100% coverage gate (owned runtime code)
        run: bun run test:coverage

  # 레이아웃·페인트·포커스 계약은 happy-dom이 볼 수 없어 e2e만 지킨다. 어느 계약이 깨질지
  # 미리 알 수 없으므로 골라 돌리지 않고 전부 돈다.
  e2e:
    runs-on: ubuntu-latest
    # globalSetup(build.ts)과 fixtures의 readUrlFromStdout에는 자체 타이머가 없고 Playwright의
    # per-test timeout도 그 둘을 덮지 않는다 — 매달리면 기본 상한까지 러너를 태운다.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Playwright는 spec·fixture·globalSetup을 항상 Node로 돌린다 — 러너 기본 Node에 기대지 않는다.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      # playwright.config.ts가 channel:"chrome"이라 번들 Chromium이 아니라 실제 Chrome이 필요하다.
      - name: Install Google Chrome for Playwright
        run: bunx playwright install --with-deps chrome
      - name: e2e (real browser)
        run: bun run test:e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/viewer/test-results/
          retention-days: 7
