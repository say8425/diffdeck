name: PR Check

on:
  pull_request:
    branches: [main]

# 연속 푸시의 중복 실행을 취소한다(e2e가 무겁다).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Lint (oxlint)
        run: bun run lint
      - name: Check formatting (oxfmt)
        run: bun run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun test

  # 다른 잡은 .bun-version으로 돈다. 사용자는 지원 하한까지의 어느 Bun으로든 배포물을
  # 돌리므로, 릴리스와 같은 Bun으로 빌드한 dist/cli.js와 테스트 스위트를 하한 Bun에서
  # 돌린다(ci-release.md).
  bun-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUN_FLOOR: 1.4.0
    steps:
      - uses: actions/checkout@v7
      # 두 setup-bun이 같은 경로에 깔린다. 캐시를 켜면 이 스텝의 post가 하한 바이너리를
      # 고정 버전 키로 저장할 수 있다.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: apps/viewer
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_FLOOR }}
      - name: Check the floor Bun is on PATH
        run: test "$(bun --version)" = "$BUN_FLOOR"
      # bun test보다 먼저 돈다. cli-smoke.test.ts가 PATH의 bun으로 dist를 다시 빌드한다.
      - name: Smoke the release bundle
        run: scripts/smoke-cli.sh
      - run: bun test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: 100% coverage gate (owned runtime code)
        run: bun run test:coverage

  # 레이아웃·페인트·포커스 계약은 happy-dom이 볼 수 없어 e2e만 지킨다. 어느 계약이 깨질지
  # 미리 알 수 없으므로 골라 돌리지 않고 전부 돈다.
  e2e:
    runs-on: ubuntu-latest
    # globalSetup(build.ts)과 fixtures의 readUrlFromStdout에는 자체 타이머가 없고 Playwright의
    # per-test timeout도 그 둘을 덮지 않는다 — 매달리면 기본 상한까지 러너를 태운다.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # Playwright는 spec·fixture·globalSetup을 항상 Node로 돌린다 — 러너 기본 Node에 기대지 않는다.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      # playwright.config.ts가 channel:"chrome"이라 번들 Chromium이 아니라 실제 Chrome이 필요하다.
      - name: Install Google Chrome for Playwright
        run: bunx playwright install --with-deps chrome
      - name: e2e (real browser)
        run: bun run test:e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/viewer/test-results/
          retention-days: 7
