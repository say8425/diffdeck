name: PR Check

on:
  pull_request:
    branches: [main]

# 연속 푸시가 중복 실행을 쌓지 않게 한다 — e2e가 붙은 뒤로 한 번 돌 때마다
# 브라우저 작업이 수 분씩 들어간다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint (oxlint)
        run: bun run lint
      - name: Check formatting (oxfmt)
        run: bun run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test

  # 위아래 잡들은 setup-bun 기본값으로 돈다 — 루트 package.json에 `packageManager`·
  # `engines.bun`이 없으므로 최신 Bun이다. 그런데 Bun 1.3.x의 `$`는
  # 64KB를 넘는 stdout을 받는 호출에서 영영 settle하지 않을 수 있고(업스트림은
  # 1.4.0에서 수정), 최신 Bun에서는 그 회귀가 원리적으로 안 보인다 — showBytes를
  # `$`로 되돌려도 `test` 잡은 초록이다. `bunx` 사용자는 자기 Bun을 쓰므로 1.3.x도
  # 여전히 대상이라, 그 결함의 회귀망만 1.3.x 마지막 판으로 고정해 따로 돌린다.
  # 전량은 `test` 잡이 이미 돈다 — 여기엔 버전에 따라 판별력이 갈리는 것만 싣는다.
  # 지원 하한이 1.4 이상이 되면(`engines.bun` 도입 등) 이 잡은 지운다.
  test-bun13:
    runs-on: ubuntu-latest
    # 회귀하면 테스트가 스스로 10초 타임아웃으로 끝나지만, Bun 다운로드나 러너가
    # 매달리는 경우까지 GHA 기본값(6시간)을 태우지 않게 상한을 둔다.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      # `bun install`은 일부러 없다. 이 회귀망은 Bun·Node 내장과 로컬 파일만 쓰므로
      # 의존성이 필요 없고(설치 없이 1.3.14에서 통과·되돌리면 실패, 둘 다 실측),
      # 설치를 넣으면 최신 Bun이 lockfile 포맷을 바꾸는 날 1.3.14가 그걸 못 읽어
      # 이 잡이 회귀와 무관하게 빨개진다 — 그때 쉬운 오답은 고정 판을 올리는 것이고,
      # 그러면 이 잡의 존재 이유가 사라진다.
      - name: Bun 1.3.x `$` never-settle regression
        run: >-
          bun test
          apps/viewer/__tests__/diff-large-blob.test.ts
          apps/viewer/__tests__/git-output.test.ts

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: 100% coverage gate (owned runtime code)
        run: bun run test:coverage

  # e2e는 "실제로 보이는 것"을 검증하는 유일한 레인이다 — happy-dom에는
  # 레이아웃이 없어서 창 크기가 변하지 않는지·버튼이 실제로 페인트되는지·
  # 클릭해도 포커스가 남는지는 유닛이 원리적으로 못 잡는다. 게이트에 없으면
  # 그 계약들은 아무도 지키지 않는다. 다른 잡보다 수십 배 무겁지만,
  # 어느 계약이 깨질지 미리 알 수 없으므로 골라 돌리지 않고 전부 돌린다.
  e2e:
    runs-on: ubuntu-latest
    # globalSetup(build.ts 실행)과 fixtures의 readUrlFromStdout에는 자체 타이머가
    # 없고 Playwright의 per-test timeout도 그 둘을 덮지 않는다. 잡 타임아웃이
    # 없으면 GHA 기본값이 6시간이라, 한 번 매달리면 러너를 그만큼 태운다
    # (이 리포엔 실제로 Bun $ never-settle 행업 전례가 있다). 실제 소요는 수 분대라
    # 15분은 넉넉한 상한이다 — 정확한 값은 최근 Actions 런이 답한다.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Playwright Test는 spec·fixture·globalSetup을 항상 Node로 실행한다
      # (bunx로 띄워도 마찬가지) — 러너 기본 Node에 기대지 않고 고정한다.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      # playwright.config.ts가 channel:"chrome"이라 번들 Chromium이 아니라
      # 실제 Google Chrome이 필요하다. --with-deps로 헤드리스 구동에 필요한
      # 시스템 라이브러리까지 함께 깐다.
      - name: Install Google Chrome for Playwright
        run: bunx playwright install --with-deps chrome
      # globalSetup이 build.ts를 1회 실행해 진짜 dist/cli.js를 만들고,
      # 각 spec은 그걸 실제로 spawn한다.
      - name: e2e (real browser)
        run: bun run test:e2e
      # 실패 산출물이 없으면 CI 전용 실패를 로컬에서 재현할 단서가 없다.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/viewer/test-results/
          retention-days: 7
