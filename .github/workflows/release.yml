name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # Plural on purpose: the singular `release_created` is path-prefixed
      # (`apps/viewer--release_created`) and omitted when nothing is released, so reading
      # it would silently stop npm publishes. Keep in sync with the gate below.
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      # A human merges the release PR on purpose: a release is an npm publish, and a
      # GITHUB_TOKEN merge would not re-trigger this workflow, so it would never publish.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # Must match the output name above. Compare with == 'true': the action emits the
    # string "false", which is truthy.
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Trusted publishing (OIDC) needs Node >= 22.14.0 and npm >= 11.5.1.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - name: Build the publishable package
        run: bun run build
        working-directory: apps/viewer
      # Tokenless: npm authenticates via OIDC (id-token: write) against the trusted
      # publisher registered on npmjs.com for this repo and workflow file (release.yml).
      - name: Publish to npm (trusted publishing + provenance)
        run: npm publish --provenance --access public
        working-directory: apps/viewer
