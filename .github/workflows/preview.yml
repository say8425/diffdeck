name: Preview

# PR마다 그 브랜치의 뷰어를 Cloudflare Worker로 띄운다(preview.md).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: 4.137.0

jobs:
  # 포크 PR에는 시크릿이 오지 않고, 시크릿을 넣기 전에는 배포할 곳이 없다.
  # 그때는 실패 대신 건너뛴다(필수 체크가 아니다).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the preview."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.ok == 'true' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # 머지 커밋이 아니라 브랜치를 받는다 — 뷰어 라벨과 auto base(`gh pr view`)가
          # 브랜치 이름을 읽는다. fetch-depth 0이어야 origin/main이 생긴다.
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: apps/viewer
      - name: Record the snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          # main에는 PR이 없어 auto base가 자기 자신이 된다. 마지막 머지 커밋을 보인다.
          BASE: ${{ github.event_name == 'pull_request' && '@auto' || 'HEAD~1' }}
        run: bun apps/preview/cli.ts --base "$BASE"
      - name: Deploy the PR preview
        id: preview
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `--json`이어도 에셋 업로드 로그가 stdout에 섞이므로 결과는 이 파일에서 읽는다.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
          PR: ${{ github.event.pull_request.number }}
        run: |
          bunx "wrangler@$WRANGLER_VERSION" preview --config apps/preview/wrangler.jsonc --name "pr-$PR"
          url="$(jq -er 'select(.type == "preview") | .preview_urls[0]' "$WRANGLER_OUTPUT_FILE_PATH")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Deploy main
        id: main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
        run: |
          bunx "wrangler@$WRANGLER_VERSION" deploy --config apps/preview/wrangler.jsonc
          url="$(jq -er 'select(.type == "deploy") | .targets[0]' "$WRANGLER_OUTPUT_FILE_PATH")"
          case "$url" in http*) ;; *) url="https://$url" ;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # 죽은 링크를 댓글로 달지 않도록 재생과 정적 에셋이 실제로 답하는지 본다.
      - name: Smoke-check the deployment
        if: steps.preview.outputs.url || steps.main.outputs.url
        env:
          URL: ${{ steps.preview.outputs.url || steps.main.outputs.url }}
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 -o /dev/null "$URL/api/diff"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 -o /dev/null "$URL/main.js"
      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.url }}
        run: |
          sha="$(git rev-parse HEAD)"
          body="$(printf '프리뷰: %s\n\n커밋 %s의 뷰어입니다. 이 브랜치를 auto base와 견준 첫 화면의 API 응답을 녹화해 재생합니다. 피커로 다른 브랜치를 고르면 녹화하지 않은 diff라 화면은 녹화본에 머물고, 상태 줄에 branch not found가 뜹니다.' "$URL" "$sha")"
          apps/preview/comment.sh "$PR" "$body"

  cleanup:
    needs: gate
    if: needs.gate.outputs.ok == 'true' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # 닫힌 PR의 머지 ref가 아니라 main의 설정을 쓴다.
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: |
            .bun-version
            apps/preview
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
        run: bunx "wrangler@$WRANGLER_VERSION" preview delete --config apps/preview/wrangler.jsonc --name "pr-$PR" --skip-confirmation
      - name: Mark the comment as deleted
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ONLY_EXISTING: "1"
        run: apps/preview/comment.sh "$PR" "PR이 닫혀 프리뷰를 지웠습니다."
