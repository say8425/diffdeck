<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>diffdeck</title>
		<!-- crossorigin이 없으면 preload와 @font-face 요청의 캐시 항목이 갈린다. -->
		<link
			rel="preload"
			href="fonts/PretendardVariable.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="fonts/JetBrainsMono-wght.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<style>
			/* 폰트는 fonts.md. swap이라 폭을 재서 고정하는 곳(PR 칩)은
			   main.ts가 loadingdone에서 다시 잰다. */
			@font-face {
				font-family: "Pretendard Variable";
				font-style: normal;
				font-weight: 45 930;
				font-display: swap;
				src: url("fonts/PretendardVariable.woff2") format("woff2-variations");
			}
			/* 이탤릭도 싣는다 — 테마가 italic을 쓰고, 없으면 합성 기울임이 된다. */
			@font-face {
				font-family: "JetBrains Mono Variable";
				font-style: normal;
				font-weight: 100 800;
				font-display: swap;
				src: url("fonts/JetBrainsMono-wght.woff2") format("woff2-variations");
			}
			@font-face {
				font-family: "JetBrains Mono Variable";
				font-style: italic;
				font-weight: 100 800;
				font-display: swap;
				src: url("fonts/JetBrainsMono-Italic-wght.woff2")
					format("woff2-variations");
			}
			/* unicode-range를 한글과 원화 기호로 좁힌 것이 계약이다 — 넓히면 한자·가나
			   한 글자 때문에 한글이 없는 diff에서도 D2Coding 전체를 받는다. */
			@font-face {
				font-family: "D2Coding";
				font-style: normal;
				font-weight: 400;
				font-display: swap;
				src: url("fonts/d2coding-full.woff2") format("woff2");
				unicode-range:
					U+1100-11FF, U+20A9, U+3130-318F, U+A960-A97F, U+AC00-D7A3,
					U+D7B0-D7FF, U+FFA0-FFDC, U+FFE6;
			}
			:root {
				/* 뷰어는 다크 전용이다. 페이지가 선언해야 스크롤바·캐럿·placeholder·
				   포커스 링 같은 UA 기본값도 OS 설정과 무관하게 다크로 그려진다(파일
				   트리는 아래 `file-tree-container` 규칙이 따로 맡는다). */
				color-scheme: dark;
				--vd-font-ui:
					"Pretendard Variable", system-ui, -apple-system, "Segoe UI",
					sans-serif;
				--vd-font-code:
					"JetBrains Mono Variable", "D2Coding", ui-monospace, "SF Mono", Menlo,
					Consolas, monospace;
				/* shadow DOM 엔진에는 상속되는 커스텀 프로퍼티로만 폰트를 넘긴다. */
				--diffs-font-family: var(--vd-font-code);
				/* 리거처를 끈다 — 줄 안 변경 강조·찾기·grab이 글자 단위로 칠해서
				   리거처 한가운데에 경계가 떨어지면 반쪽만 칠해진다. */
				--diffs-font-features: "calt" 0, "liga" 0;
				--diffs-header-font-family: var(--vd-font-ui);
				--trees-font-family-override: var(--vd-font-ui);
				--vd-bg: #141415;
				--vd-inset: #070707;
				--vd-fg: #adadb1;
				--vd-fg-muted: #84848a;
				--vd-border: #070707;
				--vd-accent: #009fff;
				--vd-success: #3fb950;
				--vd-hover: color-mix(in srgb, #009fff 12%, #141415);
				--vd-radius: 6px;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				background: var(--vd-bg);
				color: var(--vd-fg);
				font-family: var(--vd-font-ui);
			}
			#app {
				display: grid;
				grid-template-columns: var(--vd-tree-w, 300px) 6px 1fr;
				grid-template-rows: auto 1fr;
				height: 100vh;
			}
			#toolbar {
				grid-column: 1 / 4;
				grid-row: 1;
				display: flex;
				align-items: center;
				padding: 8px 12px;
				border-bottom: 1px solid var(--vd-border);
				font-size: 13px;
			}
			.tb-left,
			.tb-right {
				display: flex;
				align-items: center;
				gap: 8px;
			}
			/* 오른쪽은 조작만 담고 순서가 계약이다(viewer-toolbar.md).
			   그룹이 오른쪽 끝에 붙어 있어 find 바가 펼쳐지면 그 왼쪽 이웃만
			   밀리므로 찾기가 맨 앞이어야 한다. */
			.tb-right {
				margin-left: auto;
			}
			/* 트리거 폭 사슬의 첫 마디(viewer-toolbar.md) — 기본
			   min-width:auto면 라벨 폭만큼 툴바의 최소 폭이 늘어 좁은 창에서
			   .tb-right가 화면 밖으로 밀린다. */
			.tb-left {
				min-width: 0;
			}
			/* 줄어드는 몫은 트리거와 PR 칩만 진다 — 없으면 #status가 두 줄로
			   접힌다. 둘은 `#toolbar`로 스코프한 규칙이 특이도로 되돌려 받는다
			   (소스 순서에 기대지 않는다). */
			.tb-left > * {
				flex: none;
			}
			/* 줄어드는 순서가 계약이다: 칩 제목이 먼저, 트리거가 나중. 100000은
			   트리거가 1px도 내주지 않을 만큼 큰 값이다(viewer-toolbar.md).
			   바닥 폭은 main.ts가 재서 인라인 min-width로 건다. overflow: hidden은
			   그보다 더 눌렸을 때 내용이 #status 위로 새지 않게 한다. */
			#toolbar #pr-chip {
				box-sizing: border-box;
				height: 26px;
				display: inline-flex;
				align-items: center;
				gap: 6px;
				flex: 0 100000 auto;
				min-width: 0;
				overflow: hidden;
				padding: 0 10px 0 8px;
				background: var(--vd-inset);
				color: var(--vd-fg);
				border: 1px solid var(--vd-border);
				border-radius: var(--vd-radius);
				text-decoration: none;
			}
			/* author display의 [hidden] 짝(viewer.md) — 빠지면 PR 없는
			   브랜치에서 빈 칩이 남는다. */
			#toolbar #pr-chip[hidden] {
				display: none;
			}
			#toolbar #pr-chip:hover {
				background: var(--vd-hover);
			}
			#pr-chip-icon,
			#pr-chip-number {
				display: inline-flex;
				flex: none;
			}
			#pr-chip-title {
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				color: var(--vd-fg-muted);
			}
			/* merged 보라만 앱에 새로 들인 색이다(GitHub의 merged 색). */
			.pr-icon[data-state="open"] {
				color: var(--vd-success);
			}
			.pr-icon[data-state="draft"] {
				color: var(--vd-fg-muted);
			}
			.pr-icon[data-state="merged"] {
				color: #a371f7;
			}
			.pr-icon[data-state="closed"] {
				color: #f85149;
			}
			/* 엔진의 --diffs-addition-base 등은 shadow root 안에서만 해석돼 같은
			   add·del 색을 여기 따로 적는다. */
			#change-add {
				color: var(--vd-success);
			}
			#change-del {
				color: #f85149;
			}
			/* One control height for every toolbar widget (line-height and paddings
			   otherwise disagree by a pixel or so). */
			#toolbar button {
				box-sizing: border-box;
				height: 26px;
				background: var(--vd-inset);
				color: var(--vd-fg);
				border: 1px solid var(--vd-border);
				border-radius: var(--vd-radius);
				padding: 0 10px;
				font: inherit;
				cursor: pointer;
			}
			#toolbar button {
				display: inline-flex;
				align-items: center;
			}
			#toolbar button:hover {
				background: var(--vd-hover);
			}
			/* margin·min-inline-size는 fieldset의 UA 기본값을 리셋한다. */
			#toolbar .tb-seg {
				box-sizing: border-box;
				height: 26px;
				display: inline-flex;
				align-items: center;
				gap: 2px;
				padding: 2px;
				margin: 0;
				min-inline-size: 0;
				background: var(--vd-inset);
				border: 1px solid var(--vd-border);
				border-radius: var(--vd-radius);
			}
			#toolbar .tb-seg button {
				height: 20px; /* 26 - 2px border - 4px container padding */
				background: transparent;
				border: 0;
				border-radius: 4px;
				color: var(--vd-fg-muted);
				padding: 0 10px;
				transition:
					background-color 0.15s,
					color 0.15s;
			}
			#toolbar .tb-seg button:hover {
				background: transparent;
				color: var(--vd-fg);
			}
			#toolbar .tb-seg button[aria-pressed="true"] {
				background: #2a2a2c;
				color: var(--vd-fg);
			}
			#toolbar #refresh {
				padding: 0 7px;
			}
			#toolbar #find-open {
				padding: 0 7px;
			}
			#toolbar #tree-toggle-btn {
				padding: 0 7px;
			}
			/* 돋보기는 find 바가 열려 있는 동안 숨는다. 0.12s 지연은 바가 접힌 뒤에
			   나타나게 하려는 것이고, 전이는 목적지 상태의 것을 쓰므로 닫힐 때만
			   걸린다. */
			#toolbar #find-open {
				transition:
					opacity 0.16s ease 0.12s,
					display 0.28s allow-discrete;
			}
			#toolbar:has(#find-bar:not([hidden])) #find-open {
				display: none;
				opacity: 0;
				transition:
					opacity 0.1s ease,
					display 0.1s allow-discrete;
			}
			@starting-style {
				#toolbar #find-open {
					opacity: 0;
				}
			}
			/* @starting-style + allow-discrete로 display:none까지 양방향 전이한다. */
			#toolbar .tb-find {
				box-sizing: border-box;
				height: 26px;
				display: inline-flex;
				align-items: center;
				gap: 6px;
				margin-left: 8px;
				padding: 0 8px;
				background: var(--vd-inset);
				border: 1px solid var(--vd-border);
				border-radius: var(--vd-radius);
				max-width: 340px;
				overflow: hidden;
				opacity: 1;
				transition:
					opacity 0.2s ease,
					max-width 0.2s ease,
					margin-left 0.2s ease,
					padding 0.2s ease,
					border-width 0.2s ease,
					display 0.2s allow-discrete;
			}
			#toolbar .tb-find[hidden] {
				display: none;
				opacity: 0;
				max-width: 0;
				margin-left: 0;
				padding-left: 0;
				padding-right: 0;
				border-width: 0;
			}
			@starting-style {
				#toolbar .tb-find:not([hidden]) {
					opacity: 0;
					max-width: 0;
					margin-left: 0;
					padding-left: 0;
					padding-right: 0;
					border-width: 0;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#toolbar #find-open,
				/* :has() 변형도 적어야 특이도가 더 높은 열림 쪽 전이까지 덮는다 */
				#toolbar:has(#find-bar:not([hidden])) #find-open,
				#toolbar .tb-find {
					transition: none;
				}
			}
			#toolbar #find-input {
				height: 20px;
				min-width: 160px;
				background: transparent;
				border: 0;
				outline: none;
				color: var(--vd-fg);
				font: inherit;
			}
			#toolbar #find-count {
				color: var(--vd-fg-muted);
				font-variant-numeric: tabular-nums;
				min-width: 34px;
				text-align: right;
			}
			#toolbar .tb-find button {
				box-sizing: border-box;
				height: 20px;
				padding: 0 6px;
				background: transparent;
				border: 0;
				border-radius: 4px;
				color: var(--vd-fg-muted);
				cursor: pointer;
				display: inline-flex;
				align-items: center;
			}
			#toolbar .tb-find button:hover {
				background: transparent;
				color: var(--vd-fg);
			}
			#toolbar .tb-find button:disabled {
				opacity: 0.4;
				cursor: default;
			}
			#toolbar label {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				color: var(--vd-fg);
			}
			#toolbar input[type="checkbox"] {
				appearance: none;
				-webkit-appearance: none;
				box-sizing: border-box;
				flex: none;
				width: 28px;
				height: 16px;
				margin: 0;
				border: 1px solid var(--vd-border);
				border-radius: 999px;
				background: #2a2a2c;
				position: relative;
				cursor: pointer;
				transition:
					background-color 0.15s,
					border-color 0.15s;
			}
			#toolbar input[type="checkbox"]::before {
				content: "";
				position: absolute;
				top: 2px;
				left: 2px;
				width: 10px;
				height: 10px;
				border-radius: 50%;
				background: var(--vd-fg-muted);
				transition:
					transform 0.15s ease,
					background-color 0.15s;
			}
			#toolbar input[type="checkbox"]:hover::before {
				background: var(--vd-fg);
			}
			#toolbar input[type="checkbox"]:checked {
				background: var(--vd-accent);
				border-color: var(--vd-accent);
			}
			#toolbar input[type="checkbox"]:checked::before {
				transform: translateX(12px);
				background: #fff;
			}
			#toolbar :focus-visible {
				outline: 2px solid var(--vd-accent);
				outline-offset: 1px;
			}
			.tb-overflow {
				position: relative;
			}
			#overflow-btn {
				line-height: 1;
			}
			#overflow-menu {
				position: absolute;
				top: calc(100% + 6px);
				right: 0;
				z-index: 10;
				display: flex;
				flex-direction: column;
				gap: 10px;
				min-width: 180px;
				padding: 12px;
				background: var(--vd-bg);
				border: 1px solid var(--vd-border);
				border-radius: var(--vd-radius);
				box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
			}
			#overflow-menu[hidden] {
				display: none;
			}
			/* input은 DOM에서 앞에 있지만 order로 스위치를 오른쪽에 보낸다(텍스트는
			   익명 아이템이라 order 0). */
			#overflow-menu label {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 16px;
				white-space: nowrap;
				cursor: pointer;
			}
			#overflow-menu input[type="checkbox"] {
				order: 1;
			}
			#overflow-menu .menu-divider {
				height: 1px;
				background: var(--vd-border);
			}
			#overflow-menu #version-link {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 16px;
				white-space: nowrap;
				color: var(--vd-fg-muted);
				text-decoration: none;
			}
			#overflow-menu #version-link:hover {
				color: var(--vd-fg);
			}
			#overflow-menu #version-value {
				font-variant-numeric: tabular-nums;
			}
			/* 피커는 오버플로 메뉴처럼 툴바에 앵커한 절대 위치 패널이다(grab의
			   computePlacement를 쓰지 않는다). */
			.tb-picker {
				position: relative;
			}
			/* display: flex가 계약이다 — 블록이면 안쪽 버튼이 flex item이 아니어서
			   줄어든 몫을 받지 못하고 라벨이 잘리지 않는다. max-width는 두지
			   않는다(viewer-toolbar.md). */
			#toolbar .tb-picker {
				display: flex;
				flex: 0 1 auto;
				min-width: 0;
			}
			/* min-width: 0은 위 display: flex와 한 짝이다 — 없으면 버튼의 최소 폭이
			   nowrap 라벨의 전체 폭이 되어 라벨이 잘리지 않는다. */
			#toolbar #ref-picker-btn {
				gap: 8px;
				min-width: 0;
			}
			/* 줄어드는 몫은 라벨만 진다 — 셰브론이 눌리면 컨트롤로 안 읽힌다. */
			#toolbar #ref-picker-btn > svg {
				flex: none;
			}
			#ref-picker-label {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				/* 구별되는 조각 하나만 밝힌다 — 나머지는 맥락이다. */
				color: var(--vd-fg-muted);
			}
			#picker-name {
				color: var(--vd-fg);
			}
			#ref-picker {
				position: absolute;
				top: calc(100% + 6px);
				left: 0;
				z-index: 10;
				display: flex;
				flex-direction: column;
				gap: 6px;
				min-width: 260px;
				max-width: min(420px, 90vw);
				padding: 6px;
				background: var(--vd-bg);
				border: 1px solid var(--vd-border);
				border-radius: var(--vd-radius);
				box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
			}
			/* author display의 [hidden] 짝(viewer.md) — 빠지면 패널이
			   영구히 열린 채 남는다. */
			#ref-picker[hidden] {
				display: none;
			}
			#ref-picker-search {
				box-sizing: border-box;
				height: 26px;
				padding: 0 8px;
				background: var(--vd-inset);
				border: 1px solid var(--vd-border);
				border-radius: var(--vd-radius);
				color: var(--vd-fg);
				font: inherit;
				outline: none;
			}
			#ref-picker-list {
				display: flex;
				flex-direction: column;
				max-height: 260px;
				overflow-y: auto;
			}
			/* 목록이 max-height를 넘으면 자식(행·구분선)이 눌리지 않고 목록이 스크롤돼야 한다. */
			#ref-picker-list > * {
				flex-shrink: 0;
			}
			#ref-picker .ref-row {
				box-sizing: border-box;
				position: relative;
				min-height: 26px;
				display: flex;
				flex-direction: column;
				justify-content: center;
				gap: 1px;
				padding: 0 8px 0 26px;
				border-radius: 4px;
				color: var(--vd-fg);
				cursor: pointer;
				white-space: nowrap;
			}
			#ref-picker .ref-row:hover,
			#ref-picker .ref-row[data-active="true"] {
				background: var(--vd-hover);
			}
			/* 선택 체크. `>`가 계약이다 — 빠지면 둘째 줄의 PR 아이콘까지 체크
			   자리로 날아간다. top은 첫 줄(18px)의 가운데에 맞춘 값이다. */
			#ref-picker .ref-row > svg {
				position: absolute;
				top: 7px;
				left: 8px;
				color: var(--vd-accent);
			}
			#ref-picker .ref-row[data-pr] {
				padding-top: 4px;
				padding-bottom: 4px;
			}
			#ref-picker .ref-row-line {
				display: flex;
				align-items: center;
				gap: 8px;
				min-width: 0;
				min-height: 18px;
			}
			#ref-picker .ref-row-pr {
				display: flex;
				align-items: center;
				gap: 4px;
				min-width: 0;
				font-size: 11px;
				color: var(--vd-fg-muted);
			}
			#ref-picker .ref-row-pr > svg,
			#ref-picker .ref-row-pr-number {
				flex: none;
			}
			#ref-picker .ref-row-pr-number {
				color: var(--vd-fg);
			}
			#ref-picker .ref-row-pr-title {
				overflow: hidden;
				text-overflow: ellipsis;
			}
			#ref-picker .ref-row-label {
				overflow: hidden;
				text-overflow: ellipsis;
			}
			#ref-picker .ref-section {
				padding: 6px 8px 3px;
				font-size: 11px;
				letter-spacing: 0.04em;
				color: var(--vd-fg-muted);
			}
			#ref-picker .ref-divider {
				height: 1px;
				background: var(--vd-border);
				margin: 6px 2px 0;
			}
			#ref-picker .ref-row-tag {
				margin-left: auto;
				padding-left: 10px;
				font-size: 11px;
				color: var(--vd-fg-muted);
			}
			#ref-picker-empty {
				padding: 4px 8px;
				color: var(--vd-fg-muted);
			}
			#tree {
				grid-row: 2;
				grid-column: 1;
				overflow: auto;
				padding-top: 8px;
			}
			/* 파일 트리 엔진은 `:host { color-scheme: light dark }`를 선언하고 색을
			   light-dark()로 고른다. diff 엔진의 `themeType` 같은 전용 옵션이 없어서,
			   OS가 라이트 모드면 사이드바만 하얗게(#f8f8f8) 그려졌다. :root의
			   color-scheme은 상속될 뿐이라 host에 직접 걸린 :host 선언을 이기지
			   못한다 — host에 바로 건다(`!important`가 아닌 한 바깥 문서의 규칙이
			   :host 규칙을 이긴다). 트리의 `unsafeCSS` 옵션으로도 덮을 수 있지만, 다크
			   전용이라는 정책은 페이지 CSS 한곳에 둔다. 엔진 코드는 손대지 않는다.
			   회귀망: color-scheme.e2e.ts. */
			file-tree-container {
				color-scheme: dark;
			}
			#tree-resizer {
				grid-row: 2;
				grid-column: 2;
				position: relative;
				cursor: col-resize;
				touch-action: none;
			}
			#tree-resizer::after {
				content: "";
				position: absolute;
				inset: 0;
				left: 50%;
				width: 1px;
				transform: translateX(-50%);
				background: var(--vd-border);
			}
			#tree-resizer:hover::after,
			#tree-resizer[data-dragging="true"]::after {
				width: 2px;
				background: var(--vd-accent);
			}
			#tree-resizer:focus-visible {
				outline: 2px solid var(--vd-accent);
				outline-offset: -2px;
			}
			body.vd-resizing {
				cursor: col-resize !important;
				user-select: none;
			}
			#diff {
				grid-row: 2;
				grid-column: 3;
				overflow: auto;
			}
			#app[data-tree-side="right"] {
				grid-template-columns: 1fr 6px var(--vd-tree-w, 300px);
			}
			#app[data-tree-side="right"] #tree {
				grid-column: 3;
			}
			#app[data-tree-side="right"] #diff {
				grid-column: 1;
			}
			/* Must stay after the data-tree-side rules: same specificity, so source
			   order decides. #diff is pinned to column 1 explicitly — otherwise its
			   base grid-column: 3 lands in an implicit auto-sized column of the
			   single-track grid. */
			#app[data-tree-hidden="true"] {
				grid-template-columns: 1fr;
			}
			#app[data-tree-hidden="true"] #tree {
				display: none;
			}
			#app[data-tree-hidden="true"] #tree-resizer {
				display: none;
			}
			#app[data-tree-hidden="true"] #diff {
				grid-column: 1;
			}
			#status,
			#empty {
				color: var(--vd-fg-muted);
			}
			#empty {
				padding: 24px;
			}
			#empty[data-loading] {
				display: flex;
				align-items: center;
				gap: 10px;
			}
			/* #empty { padding }을 이겨야 해서 id로 스코프한다. */
			#empty.empty-card {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 8px;
				padding: 48px 24px;
				text-align: center;
			}
			.empty-headline {
				font-size: 15px;
				font-weight: 600;
				color: var(--vd-fg);
			}
			.empty-context {
				font-size: 12px;
			}
			.empty-action {
				font: inherit;
				font-size: 12px;
				padding: 4px 10px;
				border: 1px solid var(--vd-border);
				border-radius: var(--vd-radius);
				background: var(--vd-inset);
				color: var(--vd-fg);
				cursor: pointer;
			}
			.empty-action:hover {
				background: var(--vd-hover);
			}
			.empty-quiet {
				font-size: 12px;
			}
			.loading-spinner {
				width: 14px;
				height: 14px;
				flex: none;
				border: 2px solid var(--vd-border);
				border-top-color: var(--vd-fg-muted);
				border-radius: 50%;
				animation: vd-spin 0.8s linear infinite;
			}
			@keyframes vd-spin {
				to {
					transform: rotate(360deg);
				}
			}
			#grab-popover {
				position: fixed;
				z-index: 20;
				width: 340px;
				padding: 8px;
				display: flex;
				flex-direction: column;
				gap: 6px;
				border: 1px solid #3a3a40;
				border-radius: 8px;
				background: #232329;
				color: #d6d6da;
				box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
			}
			#grab-popover[hidden] {
				display: none;
			}
			/* 줄 높이를 라벨 행고(15px)로 못박는다 — 닫기 버튼(18px)이 줄을 키우면
			   팝오버 높이가 main.ts의 POPOVER_SIZE와 어긋난다. */
			#grab-popover .grab-head {
				display: flex;
				align-items: center;
				gap: 8px;
				height: 15px;
			}
			#grab-popover .grab-label {
				flex: 1 1 auto;
				min-width: 0;
				font-size: 11px;
				/* 정수 행고 — 팝오버 높이가 소수가 되지 않게 한다. */
				line-height: 15px;
				color: var(--vd-fg-muted);
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			/* side 색은 diff의 add·del(#3fb950·#f85149)을 글자용으로 낮춘 톤이다. */
			#grab-popover .grab-l-file {
				color: #c2c2ca;
			}
			#grab-popover .grab-l-range {
				color: #8fb4f5;
			}
			#grab-popover .grab-l-sep {
				color: #55555c;
			}
			#grab-popover .grab-l-side {
				color: #6fae7c;
			}
			#grab-popover .grab-l-side-old {
				color: #c07f7b;
			}
			/* 테두리·배경은 textarea가 아니라 이 래퍼가 갖는다 — 보내기 버튼이 같은
			   상자를 공유한다. */
			#grab-popover .grab-field {
				display: flex;
				align-items: flex-end;
				gap: 6px;
				background: #1a1a1f;
				border: 1px solid #3a3a40;
				border-radius: var(--vd-radius);
				padding: 4px 4px 4px 8px;
			}
			#grab-popover .grab-field:focus-within {
				border-color: #5b8def;
			}
			#grab-popover textarea {
				flex: 1 1 auto;
				min-width: 0;
				background: none;
				border: none;
				color: #e6e6ea;
				padding: 2px 0;
				font: inherit;
				font-size: 12px;
				/* 정수 행고 — 소수면 팝오버 높이가 소수가 되어 레티나에서 1px
				   흔들린다. */
				line-height: 18px;
				outline: none;
				/* 미지원 브라우저에서는 rows=1 + 스크롤로 강등된다. */
				field-sizing: content;
				/* 정확히 5줄(18 × 5). */
				max-height: 90px;
				resize: none;
				overflow-y: auto;
			}
			/* 배경 없이 색으로만 상태를 말한다(grab.md). */
			#grab-popover .grab-send {
				flex: none;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 20px;
				height: 20px;
				padding: 0;
				border: none;
				border-radius: 4px;
				background: none;
				color: #6f6f7a;
				cursor: pointer;
				transition: color 0.12s;
			}
			#grab-popover .grab-send:hover {
				color: var(--vd-fg);
			}
			#grab-popover .grab-send:focus-visible {
				outline: 2px solid var(--vd-accent);
				outline-offset: 1px;
			}
			#grab-popover .grab-send[data-state="ready"] {
				color: var(--vd-accent);
			}
			#grab-popover .grab-send[data-state="ok"] {
				color: var(--vd-success);
			}
			#grab-popover .grab-send[data-state="fail"] {
				color: #f85149;
			}
			/* 음수 마진: 세로 −2px은 18px 상자를 15px 줄 안에 눕히고, 오른쪽 −3px은
			   아이콘 획을 패딩 가장자리에 맞춘다. */
			#grab-popover .grab-close {
				flex: none;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 18px;
				height: 18px;
				margin: -2px -3px -2px 0;
				padding: 0;
				border: none;
				border-radius: 4px;
				background: none;
				color: #6f6f7a;
				cursor: pointer;
				transition:
					color 0.12s,
					background-color 0.12s;
			}
			/* --vd-hover는 페이지 배경 기반이라 팝오버 위에서는 가라앉는다. */
			#grab-popover .grab-close:hover {
				color: var(--vd-fg);
				background: #2c2c33;
			}
			#grab-popover .grab-close:focus-visible {
				outline: 2px solid var(--vd-accent);
				outline-offset: 1px;
			}
			#grab-popover .grab-send svg {
				display: none;
			}
			#grab-popover .grab-send[data-state="idle"] .i-send,
			#grab-popover .grab-send[data-state="ready"] .i-send,
			#grab-popover .grab-send[data-state="ok"] .i-ok,
			#grab-popover .grab-send[data-state="fail"] .i-fail {
				display: block;
			}
			#grab-popover .grab-keys {
				font-size: 11px;
				/* 정수 행고(.grab-label과 같은 이유). */
				line-height: 15px;
				color: var(--vd-fg-muted);
				white-space: nowrap;
			}
			#grab-popover .grab-keys-k {
				color: #c2c2ca;
			}
			/* 스크린리더 전용 — 보이는 줄로 두면 복사할 때마다 창이 자란다.
			   hidden으로 숨기지 않는다(라이브 리전이 읽히지 않는다). */
			#grab-popover .grab-hint {
				position: absolute;
				width: 1px;
				height: 1px;
				margin: -1px;
				padding: 0;
				overflow: hidden;
				clip-path: inset(50%);
				white-space: nowrap;
				border: 0;
			}
		</style>
	</head>
	<body>
		<div id="app">
			<div id="toolbar">
				<div class="tb-left">
					<div class="tb-picker">
						<button
							id="ref-picker-btn"
							type="button"
							aria-haspopup="listbox"
							aria-expanded="false"
							aria-controls="ref-picker"
						>
							<span id="ref-picker-label"
								><span id="picker-scope"></span><span id="picker-name"></span
								><span id="picker-branch"></span
							></span>
							<svg
								width="12"
								height="12"
								viewBox="0 0 12 12"
								fill="none"
								aria-hidden="true"
							>
								<path
									d="M3 4.5 6 7.5 9 4.5"
									stroke="currentColor"
									stroke-width="1.5"
								/>
							</svg>
						</button>
						<div id="ref-picker" hidden>
							<input
								id="ref-picker-search"
								type="text"
								placeholder="Filter worktrees and branches"
								aria-label="Filter worktrees and branches"
								role="combobox"
								aria-expanded="true"
								aria-controls="ref-picker-list"
								aria-autocomplete="list"
								autocomplete="off"
								spellcheck="false"
							/>
							<div
								id="ref-picker-list"
								role="listbox"
								aria-label="What to view"
							></div>
						</div>
					</div>
					<a id="pr-chip" hidden target="_blank" rel="noopener noreferrer"
						><span id="pr-chip-icon"></span><span id="pr-chip-number"></span
						><span id="pr-chip-title"></span
					></a>
					<span id="status"></span>
					<!-- 조각 사이에 공백 텍스트 노드를 두지 않는다(#change-del이 구분자를
					     품는다). -->
					<span id="change-totals"
						><span id="change-add"></span><span id="change-del"></span
					></span>
				</div>
				<div class="tb-right">
					<button
						id="find-open"
						type="button"
						aria-label="Search (⌘F / Ctrl+F)"
						title="Search (⌘F / Ctrl+F)"
					>
						<svg
							width="14"
							height="14"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2.2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<circle cx="11" cy="11" r="8" />
							<line x1="21" y1="21" x2="16.65" y2="16.65" />
						</svg>
					</button>
					<search id="find-bar" class="tb-find" hidden>
						<input
							id="find-input"
							type="text"
							placeholder="Search diff"
							aria-label="Search diff"
							autocomplete="off"
							spellcheck="false"
						/>
						<span id="find-count" aria-live="polite"></span>
						<button
							id="find-prev"
							type="button"
							aria-label="Previous match"
							title="Previous (Shift+Enter)"
						>
							↑
						</button>
						<button
							id="find-next"
							type="button"
							aria-label="Next match"
							title="Next (Enter)"
						>
							↓
						</button>
						<button
							id="find-close"
							type="button"
							aria-label="Close search"
							title="Close (Esc)"
						>
							✕
						</button>
					</search>
					<button
						id="refresh"
						type="button"
						aria-label="Refresh"
						title="Refresh"
					>
						<svg
							width="14"
							height="14"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2.2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<polyline points="23 4 23 10 17 10" />
							<path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
						</svg>
					</button>
					<fieldset
						class="tb-seg"
						id="diff-style-group"
						aria-label="Diff style"
					>
						<button type="button" data-style="unified" aria-pressed="true">
							Unified
						</button>
						<button type="button" data-style="split" aria-pressed="false">
							Split
						</button>
					</fieldset>
					<button
						id="tree-toggle-btn"
						type="button"
						aria-pressed="false"
						aria-label="Hide file tree"
						title="Hide file tree"
					>
						<svg
							width="14"
							height="14"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2.2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<rect x="3" y="3" width="18" height="18" rx="2" />
							<line x1="9" y1="3" x2="9" y2="21" />
						</svg>
					</button>
					<div class="tb-overflow">
						<button
							id="overflow-btn"
							type="button"
							aria-haspopup="true"
							aria-expanded="false"
							aria-label="More options"
						>
							⋯
						</button>
						<div id="overflow-menu" hidden>
							<label
								><input type="checkbox" id="toggle-untracked" /> Include
								untracked</label
							>
							<label><input type="checkbox" id="toggle-watch" /> Watch</label>
							<label
								><input type="checkbox" id="toggle-flatten" /> Flatten</label
							>
							<label
								><input type="checkbox" id="toggle-tree-side" /> Tree on
								right</label
							>
							<label
								><input type="checkbox" id="toggle-tree-hidden" /> Hide file
								tree</label
							>
							<label
								><input type="checkbox" id="toggle-fold-with-tree" /> Fold with
								tree</label
							>
							<div class="menu-divider"></div>
							<a
								id="version-link"
								href="https://github.com/say8425/diffdeck"
								target="_blank"
								rel="noopener noreferrer"
								title="Open diffdeck on GitHub"
								><span>diffdeck</span><span id="version-value"></span
							></a>
						</div>
					</div>
				</div>
			</div>
			<div id="tree"></div>
			<div
				id="tree-resizer"
				role="separator"
				aria-orientation="vertical"
				aria-label="Resize file tree"
				aria-valuemin="180"
				aria-valuemax="600"
				aria-valuenow="300"
				tabindex="0"
			></div>
			<div id="diff"></div>
		</div>
		<script type="module" src="/main.js"></script>
	</body>
</html>
