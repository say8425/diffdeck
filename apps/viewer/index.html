<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>diffdeck</title>
		<style>
			:root {
				--vd-bg: #141415;
				--vd-inset: #070707;
				--vd-fg: #adadb1;
				--vd-fg-muted: #84848a;
				--vd-border: #070707;
				--vd-accent: #009fff;
				--vd-success: #3fb950;
				--vd-hover: color-mix(in srgb, #009fff 12%, #141415);
				--vd-radius: 6px;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				background: var(--vd-bg);
				color: var(--vd-fg);
				font-family:
					system-ui,
					-apple-system,
					"Segoe UI",
					sans-serif;
			}
			#app {
				display: grid;
				grid-template-columns: var(--vd-tree-w, 300px) 6px 1fr;
				grid-template-rows: auto 1fr;
				height: 100vh;
			}
			#toolbar {
				grid-column: 1 / 4;
				grid-row: 1;
				display: flex;
				align-items: center;
				padding: 8px 12px;
				border-bottom: 1px solid var(--vd-border);
				font-size: 13px;
			}
			.tb-left,
			.tb-right {
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.tb-right {
				margin-left: auto;
			}
			/* 리포·브랜치 표식 — 조작이 아니라 정보다. #status와 같은 종(種)이라
			   상자가 없고(배경·테두리·radius 없음), 툴바의 13px·시스템 스택을
			   그대로 상속하므로 font 선언 자체를 두지 않는다. */
			#repo-label {
				/* 긴 브랜치명이 .tb-right를 화면 밖으로 밀지 못하게 한다. 260px은
				   #ref-picker-btn과 같은 값 — 담는 내용이 똑같이 git 참조명이라
				   상한을 공유한다. 툴바에는 flex-wrap도 @media도 없어서 이 상한이
				   없으면 긴 이름 하나로 레이아웃이 깨진다. */
				max-width: 260px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				color: var(--vd-fg-muted);
			}
			/* 한 라벨 안에서 조각을 색으로 가르는 것은 .grab-label의 관례다.
			   주인공은 워크트리 이름이다 — 사용자가 헷갈리는 축이 그것이라서. */
			#repo-name {
				color: var(--vd-fg);
			}
			/* One control height for every toolbar widget — without it, line-height:
     normal + differing paddings yield 25/26/26.5/27px mismatches. */
			#toolbar button {
				box-sizing: border-box;
				height: 26px;
				background: var(--vd-inset);
				color: var(--vd-fg);
				border: 1px solid var(--vd-border);
				border-radius: var(--vd-radius);
				padding: 0 10px;
				font: inherit;
				cursor: pointer;
			}
			#toolbar button {
				display: inline-flex;
				align-items: center;
			}
			#toolbar button:hover {
				background: var(--vd-hover);
			}
			/* Segmented control (Pierre-style): inset pill, active segment raised.
     fieldset 기본 스타일(margin/min-inline-size)을 리셋해 div 시절과 동일하게 유지. */
			#toolbar .tb-seg {
				box-sizing: border-box;
				height: 26px;
				display: inline-flex;
				align-items: center;
				gap: 2px;
				padding: 2px;
				margin: 0;
				min-inline-size: 0;
				background: var(--vd-inset);
				border: 1px solid var(--vd-border);
				border-radius: var(--vd-radius);
			}
			#toolbar .tb-seg button {
				height: 20px; /* 26 - 2px border - 4px container padding */
				background: transparent;
				border: 0;
				border-radius: 4px;
				color: var(--vd-fg-muted);
				padding: 0 10px;
				transition:
					background-color 0.15s,
					color 0.15s;
			}
			#toolbar .tb-seg button:hover {
				background: transparent;
				color: var(--vd-fg);
			}
			#toolbar .tb-seg button[aria-pressed="true"] {
				background: #2a2a2c;
				color: var(--vd-fg);
			}
			#toolbar #refresh {
				padding: 0 7px;
			}
			#toolbar #find-open {
				padding: 0 7px;
			}
			#toolbar #tree-toggle-btn {
				padding: 0 7px;
			}
			/* Hide the toolbar search button while the find bar is already open
			   (redundant affordance). 닫힘 안무: 바가 아이콘 자리로 접힌 "뒤에"
			   돋보기가 나타나야 자연스러우므로, 보이는 상태(기본 규칙)의 전이에
			   0.12s 지연을 둔다 — CSS 전이는 목적지 상태의 transition을 쓰므로
			   이 지연은 닫힘(나타남)에만 적용된다. */
			#toolbar #find-open {
				transition:
					opacity 0.16s ease 0.12s,
					display 0.28s allow-discrete;
			}
			#toolbar:has(#find-bar:not([hidden])) #find-open {
				display: none;
				opacity: 0;
				/* 열림: 바가 즉시 자리를 차지하므로 지연 없이 빠르게 사라진다. */
				transition:
					opacity 0.1s ease,
					display 0.1s allow-discrete;
			}
			@starting-style {
				#toolbar #find-open {
					opacity: 0;
				}
			}
			/* In-app find bar (opens on Cmd/Ctrl+F). Sits in the toolbar; hidden by
			   default. 열릴 때 돋보기 자리에서 가로로 펼쳐지고(max-width 0→340px),
			   닫힐 때 같은 모션으로 접힌다 — @starting-style + allow-discrete로
			   display:none 양방향 트랜지션. */
			#toolbar .tb-find {
				box-sizing: border-box;
				height: 26px;
				display: inline-flex;
				align-items: center;
				gap: 6px;
				margin-left: 8px;
				padding: 0 8px;
				background: var(--vd-inset);
				border: 1px solid var(--vd-border);
				border-radius: var(--vd-radius);
				max-width: 340px;
				overflow: hidden;
				opacity: 1;
				transition:
					opacity 0.2s ease,
					max-width 0.2s ease,
					margin-left 0.2s ease,
					padding 0.2s ease,
					border-width 0.2s ease,
					display 0.2s allow-discrete;
			}
			#toolbar .tb-find[hidden] {
				display: none;
				opacity: 0;
				max-width: 0;
				margin-left: 0;
				padding-left: 0;
				padding-right: 0;
				border-width: 0;
			}
			@starting-style {
				#toolbar .tb-find:not([hidden]) {
					opacity: 0;
					max-width: 0;
					margin-left: 0;
					padding-left: 0;
					padding-right: 0;
					border-width: 0;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#toolbar #find-open,
				/* :has() 변형도 명시해야 열림 방향(더 높은 특이도 규칙의 전이)까지 덮는다 */
				#toolbar:has(#find-bar:not([hidden])) #find-open,
				#toolbar .tb-find {
					/* 전이 제거 → display가 즉시 전환되어 기존 즉시 표시/숨김으로 강등 */
					transition: none;
				}
			}
			#toolbar #find-input {
				height: 20px;
				min-width: 160px;
				background: transparent;
				border: 0;
				outline: none;
				color: var(--vd-fg);
				font: inherit;
			}
			#toolbar #find-count {
				color: var(--vd-fg-muted);
				font-variant-numeric: tabular-nums;
				min-width: 34px;
				text-align: right;
			}
			#toolbar .tb-find button {
				box-sizing: border-box;
				height: 20px;
				padding: 0 6px;
				background: transparent;
				border: 0;
				border-radius: 4px;
				color: var(--vd-fg-muted);
				cursor: pointer;
				display: inline-flex;
				align-items: center;
			}
			#toolbar .tb-find button:hover {
				background: transparent;
				color: var(--vd-fg);
			}
			#toolbar .tb-find button:disabled {
				opacity: 0.4;
				cursor: default;
			}
			#toolbar label {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				color: var(--vd-fg);
			}
			/* 토글 스위치: 세그먼트 컨트롤과 같은 인셋 트랙(#2a2a2c 오프 상태)과
			   accent 온 상태, 동일한 .15s 트랜지션으로 Pierre 팔레트에 맞춘다. */
			#toolbar input[type="checkbox"] {
				appearance: none;
				-webkit-appearance: none;
				box-sizing: border-box;
				flex: none;
				width: 28px;
				height: 16px;
				margin: 0;
				border: 1px solid var(--vd-border);
				border-radius: 999px;
				background: #2a2a2c;
				position: relative;
				cursor: pointer;
				transition:
					background-color 0.15s,
					border-color 0.15s;
			}
			#toolbar input[type="checkbox"]::before {
				content: "";
				position: absolute;
				top: 2px;
				left: 2px;
				width: 10px;
				height: 10px;
				border-radius: 50%;
				background: var(--vd-fg-muted);
				transition:
					transform 0.15s ease,
					background-color 0.15s;
			}
			#toolbar input[type="checkbox"]:hover::before {
				background: var(--vd-fg);
			}
			#toolbar input[type="checkbox"]:checked {
				background: var(--vd-accent);
				border-color: var(--vd-accent);
			}
			#toolbar input[type="checkbox"]:checked::before {
				transform: translateX(12px);
				background: #fff;
			}
			#toolbar :focus-visible {
				outline: 2px solid var(--vd-accent);
				outline-offset: 1px;
			}
			.tb-overflow {
				position: relative;
			}
			#overflow-btn {
				line-height: 1;
			}
			#overflow-menu {
				position: absolute;
				top: calc(100% + 6px);
				right: 0;
				z-index: 10;
				display: flex;
				flex-direction: column;
				gap: 10px;
				min-width: 180px;
				padding: 12px;
				background: var(--vd-bg);
				border: 1px solid var(--vd-border);
				border-radius: var(--vd-radius);
				box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
			}
			#overflow-menu[hidden] {
				display: none;
			}
			/* 메뉴 항목: 라벨 왼쪽·스위치 오른쪽 (설정 리스트 관례). input이 DOM
			   앞에 있지만 order로 시각 순서만 뒤로 보낸다(텍스트는 익명 아이템 order 0). */
			#overflow-menu label {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 16px;
				white-space: nowrap;
				cursor: pointer;
			}
			#overflow-menu input[type="checkbox"] {
				order: 1;
			}
			/* 설정 항목과 부가 정보를 가른다. 메뉴의 flex gap(10px)이 위아래
			   여백을 주므로 margin은 두지 않는다. */
			#overflow-menu .menu-divider {
				height: 1px;
				background: var(--vd-border);
			}
			/* 토글 행과 같은 배치(이름 왼쪽·값 오른쪽)를 따르되, 조작이 아니라
			   정보이므로 muted로 눕는다. */
			#overflow-menu #version-link {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 16px;
				white-space: nowrap;
				color: var(--vd-fg-muted);
				text-decoration: none;
			}
			#overflow-menu #version-link:hover {
				color: var(--vd-fg);
			}
			#overflow-menu #version-value {
				font-variant-numeric: tabular-nums;
			}
			/* 견줄 기준 피커. 오버플로 메뉴와 같은 종(種)이다 — 툴바 컨트롤에
			   앵커된 절대 위치 패널이라 grab 팝오버의 좌표 계산이 필요 없다. */
			.tb-picker {
				position: relative;
			}
			#toolbar #ref-picker-btn {
				gap: 8px;
				max-width: 260px;
			}
			#ref-picker-label {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			#ref-picker {
				position: absolute;
				top: calc(100% + 6px);
				left: 0;
				z-index: 10;
				display: flex;
				flex-direction: column;
				gap: 6px;
				min-width: 260px;
				max-width: min(420px, 90vw);
				padding: 6px;
				background: var(--vd-bg);
				border: 1px solid var(--vd-border);
				border-radius: var(--vd-radius);
				box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
			}
			/* author가 display를 선언했으면 [hidden] 짝을 반드시 함께 둔다 —
			   없으면 author origin이 UA 규칙을 이겨 패널이 영구히 열린 채 남는다.
			   happy-dom은 textContent만 보므로 유닛이 못 잡고 실브라우저에서만
			   드러난다(#grab-popover에서 이미 한 번, .grab-hint에서 두 번 밟았다). */
			#ref-picker[hidden] {
				display: none;
			}
			#ref-picker-search {
				box-sizing: border-box;
				height: 26px;
				padding: 0 8px;
				background: var(--vd-inset);
				border: 1px solid var(--vd-border);
				border-radius: var(--vd-radius);
				color: var(--vd-fg);
				font: inherit;
				outline: none;
			}
			#ref-picker-list {
				display: flex;
				flex-direction: column;
				max-height: 260px;
				overflow-y: auto;
			}
			#ref-picker .ref-row {
				box-sizing: border-box;
				position: relative;
				min-height: 26px;
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 0 8px 0 26px;
				border-radius: 4px;
				color: var(--vd-fg);
				cursor: pointer;
				white-space: nowrap;
			}
			#ref-picker .ref-row:hover,
			#ref-picker .ref-row[data-active="true"] {
				background: var(--vd-hover);
			}
			#ref-picker .ref-row svg {
				position: absolute;
				left: 8px;
				color: var(--vd-accent);
			}
			#ref-picker .ref-row-label {
				overflow: hidden;
				text-overflow: ellipsis;
			}
			/* 구역 이름이 "무엇과 견주는가"를 말한다 — Working tree(미커밋)와
			   브랜치(갈라진 뒤 전부)는 종류가 다른데 예전엔 같은 줄에 같은
			   모양으로 있어 구분이 안 됐다. */
			#ref-picker .ref-section {
				padding: 6px 8px 3px;
				font-size: 11px;
				letter-spacing: 0.04em;
				color: var(--vd-fg-muted);
			}
			#ref-picker .ref-divider {
				height: 1px;
				background: var(--vd-border);
				margin: 6px 2px 0;
			}
			#ref-picker .ref-row-tag {
				margin-left: auto;
				padding-left: 10px;
				font-size: 11px;
				color: var(--vd-fg-muted);
			}
			#ref-picker-empty {
				padding: 4px 8px;
				color: var(--vd-fg-muted);
			}
			#tree {
				grid-row: 2;
				grid-column: 1;
				overflow: auto;
				padding-top: 8px;
			}
			#tree-resizer {
				grid-row: 2;
				grid-column: 2;
				position: relative;
				cursor: col-resize;
				touch-action: none;
			}
			#tree-resizer::after {
				content: "";
				position: absolute;
				inset: 0;
				left: 50%;
				width: 1px;
				transform: translateX(-50%);
				background: var(--vd-border);
			}
			#tree-resizer:hover::after,
			#tree-resizer[data-dragging="true"]::after {
				width: 2px;
				background: var(--vd-accent);
			}
			#tree-resizer:focus-visible {
				outline: 2px solid var(--vd-accent);
				outline-offset: -2px;
			}
			body.vd-resizing {
				cursor: col-resize !important;
				user-select: none;
			}
			#diff {
				grid-row: 2;
				grid-column: 3;
				overflow: auto;
			}
			#app[data-tree-side="right"] {
				grid-template-columns: 1fr 6px var(--vd-tree-w, 300px);
			}
			#app[data-tree-side="right"] #tree {
				grid-column: 3;
			}
			#app[data-tree-side="right"] #diff {
				grid-column: 1;
			}
			/* Wins over the data-tree-side rule above regardless of cascade order
			   concerns because it's declared later: the diff panel always takes
			   the full width when the tree is hidden, on either side. #diff must
			   be pinned back to the (now sole) column 1 explicitly -- otherwise
			   the left-side-tree base rule's grid-column: 2 still applies, and a
			   single-track grid has no column 2, so #diff collapses into an
			   implicit auto-sized column instead of filling the row. */
			#app[data-tree-hidden="true"] {
				grid-template-columns: 1fr;
			}
			#app[data-tree-hidden="true"] #tree {
				display: none;
			}
			#app[data-tree-hidden="true"] #tree-resizer {
				display: none;
			}
			#app[data-tree-hidden="true"] #diff {
				grid-column: 1;
			}
			#status,
			#empty {
				color: var(--vd-fg-muted);
			}
			#empty {
				padding: 24px;
			}
			/* 첫 로드(콜드) 로딩 표시 — 이후 갱신은 기존 내용을 유지한 채
			   백그라운드로 이뤄지므로 이 상태는 최초 응답 전에만 나타난다. */
			#empty[data-loading] {
				display: flex;
				align-items: center;
				gap: 10px;
			}
			/* 정보형 빈 상태 카드 — diff가 0건일 때 /api/summary의 실개수로
			   "변경이 실제로 어디 있는지"를 안내한다 (browser/emptyState.ts). */
			/* id 셀렉터(#empty { padding: 24px })보다 이겨야 하므로 id로 스코프. */
			#empty.empty-card {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 8px;
				padding: 48px 24px;
				text-align: center;
			}
			.empty-headline {
				font-size: 15px;
				font-weight: 600;
				color: var(--vd-fg);
			}
			.empty-context {
				font-size: 12px;
			}
			.empty-action {
				font: inherit;
				font-size: 12px;
				padding: 4px 10px;
				border: 1px solid var(--vd-border);
				border-radius: var(--vd-radius);
				background: var(--vd-inset);
				color: var(--vd-fg);
				cursor: pointer;
			}
			.empty-action:hover {
				background: var(--vd-hover);
			}
			.empty-quiet {
				font-size: 12px;
			}
			.loading-spinner {
				width: 14px;
				height: 14px;
				flex: none;
				border: 2px solid var(--vd-border);
				border-top-color: var(--vd-fg-muted);
				border-radius: 50%;
				animation: vd-spin 0.8s linear infinite;
			}
			@keyframes vd-spin {
				to {
					transform: rotate(360deg);
				}
			}
			#grab-popover {
				position: fixed;
				z-index: 20;
				width: 340px;
				padding: 8px;
				display: flex;
				flex-direction: column;
				gap: 6px;
				border: 1px solid #3a3a40;
				border-radius: 8px;
				background: #232329;
				color: #d6d6da;
				box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
			}
			#grab-popover[hidden] {
				display: none;
			}
			#grab-popover .grab-label {
				font-size: 11px;
				/* 라인박스를 정수로 못박는다 — 아래 textarea와 함께, 팝오버
				   높이가 소수가 되지 않게 하는 두 축 중 하나. */
				line-height: 15px;
				color: var(--vd-fg-muted);
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			/* 라벨은 세 종류의 정보를 담는다 — 파일명 / 잡은 줄 범위 / 어느 side.
			   색으로 그 구분을 말한다. side 색은 diff의 add·del(#3fb950·#f85149)을
			   글자용으로 낮춘 톤이라 같은 어휘로 읽힌다. */
			#grab-popover .grab-l-file {
				color: #c2c2ca;
			}
			#grab-popover .grab-l-range {
				color: #8fb4f5;
			}
			#grab-popover .grab-l-sep {
				color: #55555c;
			}
			#grab-popover .grab-l-side {
				color: #6fae7c;
			}
			#grab-popover .grab-l-side-old {
				color: #c07f7b;
			}
			/* 입력 영역 — 테두리·배경·radius를 textarea에서 이 래퍼로 올렸다.
			   보내기 버튼이 같은 상자를 공유해야 하기 때문이다. radius는
			   --vd-radius(6px) — select·세그컨트롤·find바와 같은 표준 컨트롤 값. */
			#grab-popover .grab-field {
				display: flex;
				align-items: flex-end;
				gap: 6px;
				background: #1a1a1f;
				border: 1px solid #3a3a40;
				border-radius: var(--vd-radius);
				padding: 4px 4px 4px 8px;
			}
			#grab-popover .grab-field:focus-within {
				border-color: #5b8def;
			}
			#grab-popover textarea {
				flex: 1 1 auto;
				min-width: 0;
				background: none;
				border: none;
				color: #e6e6ea;
				padding: 2px 0;
				font: inherit;
				font-size: 12px;
				/* 1.4 × 12px = 16.8 — 소수 라인박스라 팝오버 전체 높이가
				   67.7969px가 되고, 그러면 같은 높이라도 뜨는 y 오프셋에 따라
				   device 픽셀 135행/136행을 오간다(레티나에서 1px 흔들림으로
				   보인다). 18px로 못박으면 팝오버가 항상 정수 높이(69px)다. */
				line-height: 18px;
				outline: none;
				/* 내용에 맞춰 자라고 5줄쯤에서 멈춘 뒤 스크롤한다. JS 측정 대신
				   CSS에 맡겨 커버리지 게이트 안 모듈에 분기를 만들지 않는다.
				   미지원 브라우저에선 rows=1 고정 + 스크롤로 강등된다(여러 줄
				   입력 자체는 그대로 된다). */
				field-sizing: content;
				/* 정확히 5줄(18 × 5) — 예전 96px은 16.8로 나누면 5.71줄이라
				   여섯 번째 줄이 반쯤 걸쳐 보였다. */
				max-height: 90px;
				resize: none;
				overflow-y: auto;
			}
			/* 배경색 없음이 계약이다 — 상태는 색으로만 말한다. 그래서 어느
			   상태에서도 버튼 크기가, 따라서 창 크기가 변하지 않는다.
			   radius 4px는 툴바 세그먼트 버튼과 같은 "컨테이너 안쪽 버튼" 값. */
			#grab-popover .grab-send {
				flex: none;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 20px;
				height: 20px;
				padding: 0;
				border: none;
				border-radius: 4px;
				background: none;
				color: #6f6f7a;
				cursor: pointer;
				transition: color 0.12s;
			}
			#grab-popover .grab-send:hover {
				color: var(--vd-fg);
			}
			#grab-popover .grab-send:focus-visible {
				outline: 2px solid var(--vd-accent);
				outline-offset: 1px;
			}
			#grab-popover .grab-send[data-state="ready"] {
				color: var(--vd-accent);
			}
			#grab-popover .grab-send[data-state="ok"] {
				color: var(--vd-success);
			}
			#grab-popover .grab-send[data-state="fail"] {
				color: #f85149;
			}
			#grab-popover .grab-send svg {
				display: none;
			}
			#grab-popover .grab-send[data-state="idle"] .i-send,
			#grab-popover .grab-send[data-state="ready"] .i-send,
			#grab-popover .grab-send[data-state="ok"] .i-ok,
			#grab-popover .grab-send[data-state="fail"] .i-fail {
				display: block;
			}
			/* 하단 단축키 각주 — .grab-label과 같은 어휘(11px, 정수 행고,
			   --vd-fg-muted)로 입력창보다 한 단계 낮게 말한다. 키 글리프만
			   라벨의 파일명 톤(#c2c2ca)으로 밝혀 단축키와 설명을 가른다. */
			#grab-popover .grab-keys {
				font-size: 11px;
				/* 정수 행고 — 팝오버 전체 높이가 소수가 되지 않게 하는 축.
				   .grab-label과 같은 이유다. */
				line-height: 15px;
				color: var(--vd-fg-muted);
				white-space: nowrap;
			}
			#grab-popover .grab-keys-k {
				color: #c2c2ca;
			}
			/* 상태는 버튼이 눈으로 말하므로 이 노드는 스크린리더 전용이다.
			   예전처럼 보이는 줄로 두면 복사할 때마다 창이 18px 자라(실측: 66 → 84)
			   커서 아래 코드가 밀렸다. hidden을 토글하지 않는 이유이기도 하다 —
			   hidden 요소는 라이브 리전으로 알려지지 않는다. */
			#grab-popover .grab-hint {
				position: absolute;
				width: 1px;
				height: 1px;
				margin: -1px;
				padding: 0;
				overflow: hidden;
				clip-path: inset(50%);
				white-space: nowrap;
				border: 0;
			}
		</style>
	</head>
	<body>
		<div id="app">
			<div id="toolbar">
				<div class="tb-left">
					<!-- 지금 보고 있는 워크트리와 그 브랜치. 조각 사이에 공백
					     텍스트 노드가 생기면 안 된다 — #repo-branch의 텍스트가
					     이미 구분자를 품고 오므로 한 줄에 붙여 쓴다. -->
					<span id="repo-label"
						><span id="repo-name"></span><span id="repo-branch"></span
					></span>
					<div class="tb-picker">
						<button
							id="ref-picker-btn"
							type="button"
							aria-haspopup="listbox"
							aria-expanded="false"
							aria-controls="ref-picker"
						>
							<span id="ref-picker-label">Working tree</span>
							<svg
								width="12"
								height="12"
								viewBox="0 0 12 12"
								fill="none"
								aria-hidden="true"
							>
								<path
									d="M3 4.5 6 7.5 9 4.5"
									stroke="currentColor"
									stroke-width="1.5"
								/>
							</svg>
						</button>
						<div id="ref-picker" hidden>
							<input
								id="ref-picker-search"
								type="text"
								placeholder="Filter branches"
								aria-label="Filter branches"
								role="combobox"
								aria-expanded="true"
								aria-controls="ref-picker-list"
								aria-autocomplete="list"
								autocomplete="off"
								spellcheck="false"
							/>
							<div
								id="ref-picker-list"
								role="listbox"
								aria-label="Compare against"
							></div>
						</div>
					</div>
					<fieldset
						class="tb-seg"
						id="diff-style-group"
						aria-label="Diff style"
					>
						<button type="button" data-style="unified" aria-pressed="true">
							Unified
						</button>
						<button type="button" data-style="split" aria-pressed="false">
							Split
						</button>
					</fieldset>
					<button
						id="refresh"
						type="button"
						aria-label="Refresh"
						title="Refresh"
					>
						<svg
							width="14"
							height="14"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2.2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<polyline points="23 4 23 10 17 10" />
							<path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
						</svg>
					</button>
					<span id="status"></span>
				</div>
				<div class="tb-right">
					<button
						id="find-open"
						type="button"
						aria-label="Search (⌘F / Ctrl+F)"
						title="Search (⌘F / Ctrl+F)"
					>
						<svg
							width="14"
							height="14"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2.2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<circle cx="11" cy="11" r="8" />
							<line x1="21" y1="21" x2="16.65" y2="16.65" />
						</svg>
					</button>
					<search id="find-bar" class="tb-find" hidden>
						<input
							id="find-input"
							type="text"
							placeholder="Search diff"
							aria-label="Search diff"
							autocomplete="off"
							spellcheck="false"
						/>
						<span id="find-count" aria-live="polite"></span>
						<button
							id="find-prev"
							type="button"
							aria-label="Previous match"
							title="Previous (Shift+Enter)"
						>
							↑
						</button>
						<button
							id="find-next"
							type="button"
							aria-label="Next match"
							title="Next (Enter)"
						>
							↓
						</button>
						<button
							id="find-close"
							type="button"
							aria-label="Close search"
							title="Close (Esc)"
						>
							✕
						</button>
					</search>
					<button
						id="tree-toggle-btn"
						type="button"
						aria-pressed="false"
						aria-label="Hide file tree"
						title="Hide file tree"
					>
						<svg
							width="14"
							height="14"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2.2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<rect x="3" y="3" width="18" height="18" rx="2" />
							<line x1="9" y1="3" x2="9" y2="21" />
						</svg>
					</button>
					<div class="tb-overflow">
						<button
							id="overflow-btn"
							type="button"
							aria-haspopup="true"
							aria-expanded="false"
							aria-label="More options"
						>
							⋯
						</button>
						<div id="overflow-menu" hidden>
							<label
								><input type="checkbox" id="toggle-untracked" /> Include
								untracked</label
							>
							<label><input type="checkbox" id="toggle-watch" /> Watch</label>
							<label
								><input type="checkbox" id="toggle-flatten" /> Flatten</label
							>
							<label
								><input type="checkbox" id="toggle-tree-side" /> Tree on
								right</label
							>
							<label
								><input type="checkbox" id="toggle-tree-hidden" /> Hide file
								tree</label
							>
							<label
								><input type="checkbox" id="toggle-fold-with-tree" /> Fold with
								tree</label
							>
							<div class="menu-divider"></div>
							<a
								id="version-link"
								href="https://github.com/say8425/diffdeck"
								target="_blank"
								rel="noopener noreferrer"
								title="Open diffdeck on GitHub"
								><span>diffdeck</span><span id="version-value"></span
							></a>
						</div>
					</div>
				</div>
			</div>
			<div id="tree"></div>
			<div
				id="tree-resizer"
				role="separator"
				aria-orientation="vertical"
				aria-label="Resize file tree"
				aria-valuemin="180"
				aria-valuemax="600"
				aria-valuenow="300"
				tabindex="0"
			></div>
			<div id="diff"></div>
		</div>
		<script type="module" src="/main.js"></script>
	</body>
</html>
